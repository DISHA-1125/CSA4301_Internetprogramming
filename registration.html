<!DOCTYPE html>
<html>

<head>

<title>Registration Page</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
}

header{
background:#0066cc;
color:white;
text-align:center;
padding:20px;
}

nav{
background:#003366;
padding:15px;
text-align:center;
}

nav a{
color:white;
text-decoration:none;
margin:20px;
font-size:18px;
font-weight:bold;
}

nav a:hover{
color:yellow;
}

.container{

width:400px;
margin:50px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px gray;

}

input{

width:100%;
padding:10px;
margin:10px 0;

}

button{

width:100%;
padding:10px;
background:green;
color:white;
border:none;
font-size:16px;
cursor:pointer;

}

button:hover{

background:darkgreen;

}

footer{

background:#0066cc;
color:white;
text-align:center;
padding:15px;
margin-top:40px;

}

</style>

</head>

<body>

<header>

<h1>User Registration</h1>

</header>

<nav>

<a href="index.html">Home</a>

<a href="registration.html">Register</a>

</nav>

<div class="container">

<h2>Create Account</h2>

<form onsubmit="return registerUser();">
    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="Email Address" required>
    <input type="password" placeholder="Password" required>

    <button type="submit">Register</button>
</form>

<script>
function registerUser() {
    alert("Registration Successful!");
    window.location.href = "index.html";
    return false;
}
</script>

<br>

<p><b>HTTP Method:</b> POST</p>

<p>
The POST method securely sends registration details to the server using HTTPS.
</p>

</div>

<footer>

© 2026 Modern Startup Web Application

</footer>

</body>
</html>
